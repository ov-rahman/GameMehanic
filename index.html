<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>МЕХАНИКИ ИГРЫ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root{ --glow:0 0 6px rgba(255,255,255,.9), 0 0 14px rgba(255,255,255,.5); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%; width:100%;
    background:#000; color:#fff; overflow:hidden;
    font-family:'Pixelify Sans', monospace;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    touch-action:none; overscroll-behavior:none;
  }
  #game{ position:fixed; inset:0; display:block; width:100%; height:100%; background:#000; }

  /* ---------- Overlays (menus) ---------- */
  .overlay{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:3vh; padding:24px 4vw; background:#000;
    transform-origin:center center;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .overlay.hidden{ display:none; }

  /* always-visible close (✕) for the settings menu */
  #closeBtn{
    position:fixed; z-index:30; display:none;
    top:calc(env(safe-area-inset-top,0px) + 10px);
    right:calc(env(safe-area-inset-right,0px) + 12px);
    width:44px; height:44px; align-items:center; justify-content:center;
    background:#000; border:2px solid #fff; color:#fff; cursor:pointer;
    font-family:inherit; font-size:20px; text-shadow:var(--glow);
    box-shadow:0 0 8px rgba(255,255,255,.2);
  }
  #closeBtn.show{ display:flex; }
  .title{
    font-size:clamp(16px,5vw,34px); letter-spacing:2px; text-align:center;
    line-height:1.5; text-shadow:var(--glow); animation:flicker 4s infinite;
  }
  .subtitle{
    font-size:clamp(8px,2.2vw,13px); color:#8a8a8a; text-align:center;
    line-height:1.9; text-shadow:0 0 4px rgba(255,255,255,.25);
  }
  .btns{ display:flex; flex-direction:column; gap:clamp(8px,2vh,16px); width:min(520px,86vw); }
  .btn{
    font-family:inherit; font-size:clamp(10px,3vw,16px); color:#fff; background:transparent;
    border:2px solid #fff; padding:clamp(10px,2vh,18px) 14px; cursor:pointer;
    letter-spacing:2px; text-align:center; text-shadow:var(--glow);
    box-shadow:0 0 8px rgba(255,255,255,.15), inset 0 0 8px rgba(255,255,255,.05);
    transition:transform .06s ease, background .12s ease, color .12s ease;
  }
  .btn small{ display:block; margin-top:6px; font-size:.6em; color:#7a7a7a; letter-spacing:1px; text-shadow:none; }
  .btn:hover{ background:#fff; color:#000; text-shadow:none; }
  .btn:hover small{ color:#333; }
  .btn:active{ transform:scale(.97); }
  .btn.sel{ background:#fff; color:#000; text-shadow:none; }
  .btn.sel small{ color:#333; }

  .settings-box{ width:min(560px,90vw); display:flex; flex-direction:column; gap:clamp(8px,1.6vh,14px); }
  .srow{ display:flex; flex-direction:column; gap:8px; border:2px solid #333; padding:10px 12px;
         box-shadow:inset 0 0 8px rgba(255,255,255,.04); }
  .srow .lab{ display:flex; justify-content:space-between; align-items:center;
              font-size:clamp(8px,2.4vw,12px); letter-spacing:1px; text-shadow:0 0 4px rgba(255,255,255,.3); }
  .srow .val{ color:#fff; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:6px; background:#2a2a2a; outline:none; border:1px solid #555; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:20px; height:22px; background:#fff; cursor:pointer; box-shadow:var(--glow); }
  input[type=range]::-moz-range-thumb{ width:20px; height:22px; background:#fff; border:0; cursor:pointer; box-shadow:var(--glow); }
  .toggleBtn{ align-self:flex-start; padding:6px 14px; font-size:clamp(8px,2.4vw,12px); }
  .mode-mini{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:min(560px,90vw); }
  .mode-mini .btn{ padding:9px 3px; font-size:clamp(7px,2.2vw,10px); letter-spacing:1px; }

  @keyframes flicker{ 0%,18%,22%,25%,53%,57%,100%{opacity:1;} 20%,24%,55%{opacity:.72;} }

  /* ---------- CRT TV animations ---------- */
  .tv-off{ animation:tvOff .45s cubic-bezier(.5,0,.9,.5) forwards; pointer-events:none; }
  .tv-on { animation:tvOn  .5s  cubic-bezier(.1,.5,.2,1)   forwards; }
  @keyframes tvOff{
    0%{transform:scale(1,1);filter:brightness(1);opacity:1;}
    55%{transform:scale(1,.006);filter:brightness(4);opacity:1;}
    75%{transform:scale(.5,.006);filter:brightness(6);opacity:1;}
    100%{transform:scale(0,.001);filter:brightness(10);opacity:.9;}
  }
  @keyframes tvOn{
    0%{transform:scale(0,.001);filter:brightness(12);opacity:.9;}
    35%{transform:scale(1,.006);filter:brightness(7);opacity:1;}
    60%{transform:scale(1,.006);filter:brightness(5);opacity:1;}
    100%{transform:scale(1,1);filter:brightness(1);opacity:1;}
  }

  /* ---------- On-screen movement pad (left side only) ---------- */
  #pad{
    position:fixed; z-index:15; display:none; gap:14px;
    left:calc(env(safe-area-inset-left,0px) + 16px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  }
  #pad.show{ display:flex; }
  .ctrl{
    width:clamp(56px,10vw,76px); height:clamp(56px,10vw,76px);
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35); border:2px solid #fff; color:#fff;
    font-family:inherit; font-size:clamp(22px,5vw,30px); cursor:pointer;
    text-shadow:var(--glow); box-shadow:0 0 8px rgba(255,255,255,.18), inset 0 0 8px rgba(255,255,255,.05);
    touch-action:none;
  }
  .ctrl.act{ background:#fff; color:#000; text-shadow:none; }

  .hint{
    position:fixed; left:0; right:0; z-index:5; text-align:center;
    bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    font-size:clamp(6px,1.6vw,9px); color:#555; letter-spacing:1px; pointer-events:none;
    text-shadow:0 0 3px rgba(255,255,255,.15);
  }

  /* ---------- Rotate-to-landscape notice ---------- */
  #rotate{
    position:fixed; inset:0; z-index:40; background:#000;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    text-align:center; padding:8vw;
  }
  #rotate .ico{ font-size:48px; text-shadow:var(--glow); animation:spin 2.4s ease-in-out infinite; }
  #rotate .txt{ font-size:clamp(10px,4vw,16px); letter-spacing:2px; text-shadow:var(--glow); line-height:1.8; }
  @keyframes spin{ 0%,100%{transform:rotate(0);} 50%{transform:rotate(90deg);} }
  @media (orientation:portrait){ #rotate{ display:flex; } }

  /* compact menus for a phone held horizontally (short height) */
  @media (max-height:520px){
    .overlay{ gap:8px; padding:14px 4vw; justify-content:flex-start; }
    .title{ font-size:clamp(13px,5vh,22px); }
    .subtitle{ font-size:clamp(7px,2.2vh,11px); line-height:1.4; }
    .btn{ padding:7px 12px; font-size:clamp(9px,3vh,14px); letter-spacing:1px; }
    .btn small{ margin-top:2px; font-size:.58em; }
    .settings-box{ gap:6px; }
    .srow{ padding:6px 10px; gap:4px; }
    .srow .lab{ font-size:clamp(8px,2.6vh,11px); }
    .mode-mini .btn{ padding:6px 3px; }
    .toggleBtn{ padding:4px 12px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<button id="closeBtn" aria-label="закрыть">&#10005;</button>

<!-- movement pad: left side only -->
<div id="pad">
  <button class="ctrl" id="btnLeft" aria-label="влево">&#9664;</button>
  <button class="ctrl" id="btnRight" aria-label="вправо">&#9654;</button>
</div>

<div class="hint" id="hint">&#9664; &#9654; = ХОДЬБА&nbsp;&nbsp;•&nbsp;&nbsp;ТАП СПРАВА = ПРЫЖОК&nbsp;&nbsp;•&nbsp;&nbsp;3 ПАЛЬЦА / M = МЕНЮ</div>

<!-- rotate notice -->
<div id="rotate">
  <div class="ico">&#128241;</div>
  <div class="txt">ПОВЕРНИ ТЕЛЕФОН<br>ГОРИЗОНТАЛЬНО</div>
</div>

<!-- START MENU -->
<div class="overlay" id="startMenu">
  <div class="title">МЕХАНИКИ</div>
  <div class="subtitle">ВЫБЕРИ МЕХАНИКУ</div>
  <div class="btns" id="startBtns">
    <button class="btn" data-mode="vary">ВЫСОТА&nbsp;ПРЫЖКА<small>держи дольше — прыжок выше</small></button>
    <button class="btn" data-mode="coyote">ВРЕМЯ&nbsp;КОЙОТА<small>прыжок сразу после края</small></button>
    <button class="btn" data-mode="buffer">БУФЕР&nbsp;ВВОДА<small>нажми заранее — прыжок при посадке</small></button>
    <button class="btn" data-mode="hitbox">ПРОЩАЮЩИЕ&nbsp;ХИТБОКСЫ<small>край прощает промах</small></button>
    <button class="btn" data-mode="all">ВСЁ&nbsp;СРАЗУ<small>все механики вместе</small></button>
  </div>
</div>

<!-- SETTINGS MENU -->
<div class="overlay hidden" id="settingsMenu">
  <div class="title" style="font-size:clamp(12px,4vw,26px)">НАСТРОЙКИ</div>
  <div class="subtitle" id="settingsMode">РЕЖИМ: ВСЁ</div>

  <div class="mode-mini" id="miniModes">
    <button class="btn" data-mode="vary">ПРЫЖОК</button>
    <button class="btn" data-mode="coyote">КОЙОТ</button>
    <button class="btn" data-mode="buffer">БУФЕР</button>
    <button class="btn" data-mode="hitbox">ХИТБОКС</button>
    <button class="btn" data-mode="all">ВСЁ</button>
  </div>

  <div class="settings-box">
    <div class="srow" id="rowJump">
      <div class="lab"><span>УДЕРЖАНИЕ&nbsp;ПРЫЖКА</span><span class="val" id="vJump">0.28</span></div>
      <input type="range" id="sJump" min="0.06" max="0.50" step="0.01">
    </div>
    <div class="srow" id="rowPhysics">
      <div class="lab"><span>ФИЗИКА&nbsp;ПРЫЖКА</span><span class="val" id="vPhysics">ВЫКЛ</span></div>
      <button class="btn toggleBtn" id="tPhysics">ВКЛЮЧИТЬ</button>
    </div>
    <div class="srow" id="rowCoyote">
      <div class="lab"><span>ВРЕМЯ&nbsp;КОЙОТА</span><span class="val" id="vCoyote">0.12</span></div>
      <input type="range" id="sCoyote" min="0" max="0.40" step="0.01">
    </div>
    <div class="srow" id="rowBuffer">
      <div class="lab"><span>БУФЕР&nbsp;ВВОДА</span><span class="val" id="vBuffer">0.15</span></div>
      <input type="range" id="sBuffer" min="0" max="0.40" step="0.01">
    </div>
    <div class="srow" id="rowHitbox">
      <div class="lab"><span>ПРОЩЕНИЕ&nbsp;КРАЯ</span><span class="val" id="vHitbox">0.60</span></div>
      <input type="range" id="sHitbox" min="0" max="1.50" step="0.05">
    </div>
  </div>

  <div class="btns" style="width:min(560px,90vw)">
    <button class="btn" id="resumeBtn">ПРОДОЛЖИТЬ</button>
  </div>
</div>

<script>
"use strict";
(function(){
  const canvas = document.getElementById('game');   // visible screen
  const vctx = canvas.getContext('2d');
  const buf = document.createElement('canvas');      // game renders here first
  const ctx = buf.getContext('2d');                  // all draw code uses this
  let W=0, H=0, DPR=1;
  const RS=1.8;   // supersampling factor for the buffer (kills warp aliasing)

  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

  /* ---------- tunables ---------- */
  const params = {
    jumpMaxHold:0.28,   // s of holding that keeps adding height
    jumpPhysics:false,  // OFF = snappy (cut on release); ON = momentum carries
    coyoteTime:0.12,
    bufferTime:0.15,
    hitboxForgive:0.60  // tiles of landing forgiveness at edges
  };

  /* ---------- modes ---------- */
  const MODES = {
    vary  : { vary:true,  coyote:false, buffer:false, hitbox:false, pit:false, label:'ВЫСОТА ПРЫЖКА' },
    coyote: { vary:false, coyote:true,  buffer:false, hitbox:false, pit:true,  label:'ВРЕМЯ КОЙОТА' },
    buffer: { vary:false, coyote:false, buffer:true,  hitbox:false, pit:false, label:'БУФЕР ВВОДА' },
    hitbox: { vary:false, coyote:false, buffer:false, hitbox:true,  pit:true,  label:'ПРОЩАЮЩИЕ ХИТБОКСЫ' },
    all   : { vary:true,  coyote:true,  buffer:true,  hitbox:true,  pit:true,  label:'ВСЁ СРАЗУ' }
  };
  let mode='all';
  const M=()=>MODES[mode];

  /* ---------- world ---------- */
  let tile=24, groundY=0, bottomY=0, pitFloorY=0;
  let solids=[];        // {x,y,w,h} full rects (walls + floors)
  let tops=[];          // {x0,x1,y} landing surfaces
  let pit=null;         // {x0,x1,floorY} when the level has a pit

  const cube = {
    x:0, y:0, vx:0, vy:0, size:24,
    grounded:true, jumping:false, holding:false, holdTime:0,
    coyoteLeft:0, leftBy:'ground', airTime:0,
    bufferLeft:0, bufferTracking:false, varyTracking:false,
    timer:0, timerFrozen:false, landedForgiven:0,
    trail:[]
  };

  function moveSpeed(){ return tile*7.5; }
  function gravity(){ return tile*72; }
  function jumpVel(){ return -tile*22; }

  function buildLevel(keepPos){
    tile = Math.round(clamp(H*0.052, 14, 26));
    cube.size = tile;
    groundY = Math.round(H*0.66);
    bottomY = H + tile*6;
    pitFloorY = Math.round(clamp(groundY + tile*2.6, groundY+tile*2, H*0.90));

    solids=[]; tops=[]; pit=null;
    if(M().pit){
      const pitX0=Math.round(W*0.44), pitX1=Math.round(W*0.58);
      solids.push({x:0,       y:groundY,   w:pitX0,     h:bottomY-groundY});
      solids.push({x:pitX1,   y:groundY,   w:W-pitX1,   h:bottomY-groundY});
      solids.push({x:pitX0,   y:pitFloorY, w:pitX1-pitX0, h:bottomY-pitFloorY});
      tops.push({x0:0,     x1:pitX0, y:groundY});
      tops.push({x0:pitX1, x1:W,     y:groundY});
      tops.push({x0:pitX0, x1:pitX1, y:pitFloorY});
      pit={x0:pitX0, x1:pitX1, floorY:pitFloorY};
    } else {
      solids.push({x:0, y:groundY, w:W, h:bottomY-groundY});
      tops.push({x0:0, x1:W, y:groundY});
    }

    if(!keepPos){
      cube.x = M().pit ? Math.round(W*0.16) : Math.round(W*0.30);
    }
    cube.x = clamp(cube.x, 0, W-cube.size);
    cube.y = groundY - cube.size; cube.vy=0; cube.vx=0;
    cube.grounded=true; cube.jumping=false; cube.leftBy='ground';
    cube.timer=0; cube.timerFrozen=false; cube.bufferTracking=false; cube.varyTracking=false;
    cube.trail=[];
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    const pw=Math.floor(W*DPR), ph=Math.floor(H*DPR);
    canvas.width=pw; canvas.height=ph;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    buf.width=Math.floor(pw*RS); buf.height=Math.floor(ph*RS);
    ctx.setTransform(DPR*RS,0,0,DPR*RS,0,0); // game draws in CSS px into a hi-res buffer
    vctx.setTransform(1,0,0,1,0,0);          // we blit in device px
    buildLevel(true);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=>setTimeout(resize,200));

  /* ---------- collision ---------- */
  const overlap=(ax,ay,aw,ah,bx,by,bw,bh)=> ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;

  function resolveHorizontal(){
    const c=cube;
    for(const s of solids){
      if(overlap(c.x,c.y,c.size,c.size, s.x,s.y,s.w,s.h)){
        if(c.vx>0) c.x = s.x - c.size;
        else if(c.vx<0) c.x = s.x + s.w;
        c.vx=0;
      }
    }
  }

  function resolveVertical(prevBottom){
    const c=cube;
    c.grounded=false; c.landedForgiven=0;
    if(c.vy>=0){
      const newBottom=c.y+c.size;
      const pad = M().hitbox ? params.hitboxForgive*tile : 0;
      let landY=null, surf=null;
      for(const t of tops){
        const horiz = (c.x+c.size > t.x0 - pad) && (c.x < t.x1 + pad);
        if(horiz && prevBottom <= t.y+1 && newBottom >= t.y){
          if(landY===null || t.y<landY){ landY=t.y; surf=t; }
        }
      }
      if(landY!==null){
        c.y=landY-c.size; c.vy=0; c.grounded=true;
        let over=0;
        if(c.x < surf.x0) over = surf.x0 - c.x;
        else if(c.x+c.size > surf.x1) over = (c.x+c.size) - surf.x1;
        c.landedForgiven = pad>0 ? Math.min(over,pad)/tile : 0;
      }
    } else {
      for(const s of solids){
        if(overlap(c.x,c.y,c.size,c.size,s.x,s.y,s.w,s.h)){ c.y=s.y+s.h; c.vy=0; }
      }
    }
  }

  /* ---------- input ---------- */
  const input={left:false,right:false};
  const jumpPointers=new Set();

  function pressJump(){
    if(gameState!=='playing') return;
    const c=cube; c.holding=true;
    const canCoyote = M().coyote && !c.grounded && c.coyoteLeft>0 && c.leftBy==='ground' && c.vy>=0;
    if(c.grounded || canCoyote){ doJump(canCoyote); }
    else if(M().buffer){ c.bufferLeft=params.bufferTime; c.bufferTracking=true; c.timer=0; c.timerFrozen=false; }
  }
  function doJump(fromCoyote){
    const c=cube;
    if(fromCoyote){ c.timer=c.airTime; c.timerFrozen=true; }
    else if(M().vary){ c.timer=0; c.timerFrozen=false; c.varyTracking=true; }
    c.vy=jumpVel(); c.grounded=false; c.jumping=true; c.holdTime=0;
    c.leftBy='jump'; c.coyoteLeft=0; c.bufferLeft=0; c.bufferTracking=false;
  }
  function releaseJump(){
    const c=cube; c.holding=false;
    if(M().vary && c.jumping && c.vy<0 && !params.jumpPhysics){
      c.vy *= 0.5;              // no physics: soft cut (snappy but not harsh)
    }                          // physics on: keep momentum, gravity takes over
    c.jumping=false;
    if(M().vary) c.varyTracking=false;
  }

  // canvas taps = jump (right side of screen; the pad sits on the left as its own element)
  canvas.addEventListener('pointerdown', e=>{
    jumpPointers.add(e.pointerId);
    if(jumpPointers.size>=3){ openSettings(); return; }
    pressJump();
  });
  function endJumpPointer(e){ jumpPointers.delete(e.pointerId); if(jumpPointers.size===0) releaseJump(); }
  canvas.addEventListener('pointerup', endJumpPointer);
  canvas.addEventListener('pointercancel', endJumpPointer);

  // movement buttons
  function bindHold(el, on){
    const set=v=>{ input[on]=v; el.classList.toggle('act',v); };
    el.addEventListener('pointerdown', e=>{ e.preventDefault(); set(true); try{el.setPointerCapture(e.pointerId);}catch(_){} });
    el.addEventListener('pointerup',   e=>{ e.preventDefault(); set(false); });
    el.addEventListener('pointercancel', ()=>set(false));
    el.addEventListener('pointerleave',  ()=>set(false));
    el.addEventListener('contextmenu', e=>e.preventDefault());
  }
  bindHold(document.getElementById('btnLeft'),'left');
  bindHold(document.getElementById('btnRight'),'right');

  // keyboard (PC)
  window.addEventListener('keydown', e=>{
    if(e.code==='ArrowLeft'||e.key==='a'||e.key==='A'||e.key==='ф'||e.key==='Ф'){ input.left=true; }
    else if(e.code==='ArrowRight'||e.key==='d'||e.key==='D'||e.key==='в'||e.key==='В'){ input.right=true; }
    else if(e.code==='Space'||e.code==='ArrowUp'||e.key==='w'||e.key==='W'){ e.preventDefault(); if(!e.repeat) pressJump(); }
    else if(e.key==='m'||e.key==='M'||e.code==='Escape'){ e.preventDefault(); gameState==='settings'?closeSettings():openSettings(); }
  });
  window.addEventListener('keyup', e=>{
    if(e.code==='ArrowLeft'||e.key==='a'||e.key==='A'||e.key==='ф'||e.key==='Ф'){ input.left=false; }
    else if(e.code==='ArrowRight'||e.key==='d'||e.key==='D'||e.key==='в'||e.key==='В'){ input.right=false; }
    else if(e.code==='Space'||e.code==='ArrowUp'||e.key==='w'||e.key==='W'){ e.preventDefault(); releaseJump(); }
  });
  document.addEventListener('gesturestart', e=>e.preventDefault());

  /* ---------- update ---------- */
  function update(dt){
    const c=cube;
    const prevGrounded=c.grounded;

    // smooth horizontal movement (gentle ease-in/ease-out)
    const dir=(input.right?1:0)-(input.left?1:0);
    const target=dir*moveSpeed();
    c.vx += (target - c.vx) * Math.min(1, 8.5*dt);
    if(dir===0 && Math.abs(c.vx)<1.5) c.vx=0;

    // gravity (with variable-jump low gravity while holding & rising)
    if(!c.grounded){
      let g=gravity();
      if(M().vary && c.jumping && c.holding && c.vy<0 && c.holdTime<params.jumpMaxHold){
        g *= params.jumpPhysics ? 0.62 : 0.45;
        c.holdTime += dt;
      } else c.jumping=false;
      c.vy += g*dt;
      const term=tile*46; if(c.vy>term) c.vy=term;
    }

    // integrate + resolve
    c.x += c.vx*dt; resolveHorizontal(); c.x=clamp(c.x,0,W-c.size);
    const prevBottom=c.y+c.size;
    c.y += c.vy*dt; resolveVertical(prevBottom);

    // grounded / coyote bookkeeping
    if(c.grounded){
      c.coyoteLeft=params.coyoteTime; c.leftBy='ground'; c.airTime=0;
      // buffered early press fires on landing
      if(!prevGrounded && M().buffer && c.bufferLeft>0){ c.timerFrozen=true; doJump(false); }
    } else {
      c.airTime += dt;
      if(c.coyoteLeft>0){ c.coyoteLeft-=dt; if(c.coyoteLeft<0) c.coyoteLeft=0; }
      if(c.bufferLeft>0){ c.bufferLeft-=dt; if(c.bufferLeft<0){ c.bufferLeft=0; c.bufferTracking=false; } }
      if(prevGrounded){ c.timerFrozen=false; } // just walked/jumped off -> allow timer to update
    }

    updateTimer(dt);

    // faint after-image trail
    c.trail.unshift({x:c.x, y:c.y, lit:c.holding});
    if(c.trail.length>8) c.trail.pop();
  }

  function updateTimer(dt){
    const c=cube;
    if(c.timerFrozen) return;
    if(M().buffer && c.bufferTracking && c.bufferLeft>0){ c.timer -= dt; return; }
    if(M().coyote && !c.grounded && c.leftBy==='ground'){ c.timer=c.airTime; return; }
    if(M().vary && c.varyTracking && c.jumping){ c.timer=c.holdTime; return; }
    if(M().hitbox && c.grounded && c.landedForgiven>0.001){ c.timer=c.landedForgiven; c.timerFrozen=true; return; }
  }

  /* ---------- render ---------- */
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    const c=cube;
    const cxC=c.x+c.size/2;

    // ---- terrain: thin hairlines only ----
    ctx.save();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.6; ctx.lineCap='butt';
    ctx.shadowColor='rgba(255,255,255,.7)'; ctx.shadowBlur=7;
    for(const t of tops){
      ctx.beginPath(); ctx.moveTo(t.x0, t.y+.5); ctx.lineTo(t.x1, t.y+.5); ctx.stroke();
    }
    if(pit){ // thin vertical walls of the pit
      ctx.beginPath();
      ctx.moveTo(pit.x0+.5, groundY); ctx.lineTo(pit.x0+.5, pit.floorY);
      ctx.moveTo(pit.x1-.5, groundY); ctx.lineTo(pit.x1-.5, pit.floorY);
      ctx.stroke();
    }
    ctx.restore();

    // ---- shadow: hard-edged gap, a bit bigger than the cube (no soft fade) ----
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(cxC, groundY, c.size*0.82, 0, Math.PI*2); ctx.fill();

    // ---- faint after-image trail (matches the cube: filled when lit) ----
    for(let i=c.trail.length-1;i>=1;i--){
      const t=c.trail[i];
      const a=(1 - i/c.trail.length)*0.16;
      if(a<=0.012) continue;
      const tx=Math.round(t.x), ty=Math.round(t.y);
      if(t.lit){ ctx.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')'; ctx.fillRect(tx,ty,c.size,c.size); }
      else{ ctx.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')'; ctx.lineWidth=1.2; ctx.strokeRect(tx+.6,ty+.6,c.size-1.2,c.size-1.2); }
    }

    // ---- cube (thin outline; solid white while pressed) ----
    ctx.save();
    ctx.shadowColor='rgba(255,255,255,.85)'; ctx.shadowBlur=c.holding?16:8;
    const px=Math.round(c.x), py=Math.round(c.y);
    if(c.holding){ ctx.fillStyle='#fff'; ctx.fillRect(px, py, c.size, c.size); }
    else{ ctx.strokeStyle='#fff'; ctx.lineWidth=1.4; ctx.strokeRect(px+.7, py+.7, c.size-1.4, c.size-1.4); }
    ctx.restore();

    drawTimer(c.timer);
  }

  function drawTimer(v){
    let txt=v.toFixed(2); if(txt==='-0.00') txt='0.00';
    const fs=Math.min(W*0.095, H*0.21);
    const topY=Math.max(6, Math.round(H*0.04));
    // timer number — rounded system font, semi-bold with soft glow
    ctx.save();
    ctx.fillStyle='#fff';
    ctx.shadowColor='rgba(255,255,255,.55)'; ctx.shadowBlur=Math.round(fs*0.24);
    ctx.font='600 '+fs+"px -apple-system, 'Segoe UI', system-ui, Arial, sans-serif";
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(txt, W/2, topY);
    ctx.restore();
    // mechanic name UNDER the timer, clearly separated
    ctx.save();
    ctx.fillStyle='rgba(140,140,140,.9)';
    const lfs=Math.max(8, Math.round(H*0.03));
    ctx.font=lfs+"px 'Pixelify Sans', monospace";
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(M().label, W/2, topY + fs + Math.max(5, Math.round(H*0.02)));
    ctx.restore();
  }

  /* ---------- loop ---------- */
  let gameState='menu';
  let last=performance.now();
  function loop(now){
    let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05;
    if(gameState==='playing') update(dt);
    draw();
    present();
    requestAnimationFrame(loop);
  }

  // blit the buffer to screen with a convex (bulging) screen effect
  function present(){
    const pw=canvas.width, ph=canvas.height;
    vctx.setTransform(1,0,0,1,0,0);
    vctx.imageSmoothingEnabled=true; vctx.imageSmoothingQuality='high';
    vctx.clearRect(0,0,pw,ph);
    vctx.fillStyle='#000'; vctx.fillRect(0,0,pw,ph);
    const bh=buf.height;
    const cx=pw/2;
    const bow  = ph*0.032;   // vertical bow: lines dip at the centre
    const mag  = 0.032;      // extra magnification in the middle
    const hcomp= 0.03;       // horizontal squeeze towards the edges
    const sw=Math.max(2, Math.round(2*DPR));
    for(let x=0; x<pw; x+=sw){
      const w=Math.min(sw, pw-x);
      const cxs=x+w/2;
      const nx=(cxs-cx)/cx;          // -1..1 across the screen
      const k=1-nx*nx;              // 1 at centre, 0 at the edges
      const scaleY=1+mag*k;
      const dh=ph*scaleY;
      const dy=(ph-dh)/2 + bow*k;   // magnify about centre, then bow down
      const hc=1-hcomp*nx*nx;       // pull edges inward for a domed look
      const dw=w*hc;
      const dx=cx+(cxs-cx)*hc - dw/2;
      // source is the hi-res buffer (x scaled by RS); smoothed downscale => crisp
      vctx.drawImage(buf, x*RS, 0, w*RS, bh, dx-0.6, dy, dw+1.2, dh);
    }
  }

  /* ---------- menus ---------- */
  const startMenu=document.getElementById('startMenu');
  const settingsMenu=document.getElementById('settingsMenu');
  const settingsModeLbl=document.getElementById('settingsMode');
  const pad=document.getElementById('pad');
  const closeBtn=document.getElementById('closeBtn');

  function startGame(m){
    mode=m; buildLevel(false);
    startMenu.classList.add('tv-off');
    setTimeout(()=>{
      startMenu.classList.add('hidden'); startMenu.classList.remove('tv-off');
      gameState='playing'; pad.classList.add('show');
    },450);
  }
  document.getElementById('startBtns').addEventListener('click', e=>{
    const b=e.target.closest('.btn'); if(!b) return; startGame(b.dataset.mode);
  });

  function openSettings(){
    if(gameState!=='playing') return;
    gameState='settings'; pad.classList.remove('show');
    input.left=input.right=false;
    document.getElementById('btnLeft').classList.remove('act');
    document.getElementById('btnRight').classList.remove('act');
    syncSettingsUI();
    settingsMenu.classList.remove('hidden');
    settingsMenu.classList.remove('tv-off');
    settingsMenu.classList.add('tv-on');
    closeBtn.classList.add('show');
  }
  function closeSettings(){
    closeBtn.classList.remove('show');
    settingsMenu.classList.remove('tv-on'); settingsMenu.classList.add('tv-off');
    setTimeout(()=>{
      settingsMenu.classList.add('hidden'); settingsMenu.classList.remove('tv-off');
      gameState='playing'; pad.classList.add('show');
    },450);
  }
  document.getElementById('resumeBtn').addEventListener('click', closeSettings);
  closeBtn.addEventListener('click', closeSettings);

  document.getElementById('miniModes').addEventListener('click', e=>{
    const b=e.target.closest('.btn'); if(!b) return;
    mode=b.dataset.mode; buildLevel(false); syncSettingsUI();
  });

  // physics toggle
  const tPhysics=document.getElementById('tPhysics');
  tPhysics.addEventListener('click', ()=>{
    params.jumpPhysics=!params.jumpPhysics; syncSettingsUI();
  });

  // sliders
  [['sJump','vJump','jumpMaxHold'],['sCoyote','vCoyote','coyoteTime'],
   ['sBuffer','vBuffer','bufferTime'],['sHitbox','vHitbox','hitboxForgive']]
  .forEach(([sid,vid,key])=>{
    const s=document.getElementById(sid), v=document.getElementById(vid);
    s.addEventListener('input', ()=>{ params[key]=parseFloat(s.value); v.textContent=params[key].toFixed(2); });
  });

  function syncSettingsUI(){
    settingsModeLbl.textContent='РЕЖИМ: '+M().label;
    document.querySelectorAll('#miniModes .btn').forEach(b=>b.classList.toggle('sel', b.dataset.mode===mode));
    // show only the settings that belong to the selected mechanic
    const show=(id,on)=>{ document.getElementById(id).style.display = on?'flex':'none'; };
    show('rowJump',   M().vary);
    show('rowPhysics',M().vary);
    show('rowCoyote', M().coyote);
    show('rowBuffer', M().buffer);
    show('rowHitbox', M().hitbox);
    document.getElementById('sJump').value=params.jumpMaxHold;
    document.getElementById('vJump').textContent=params.jumpMaxHold.toFixed(2);
    document.getElementById('sCoyote').value=params.coyoteTime;
    document.getElementById('vCoyote').textContent=params.coyoteTime.toFixed(2);
    document.getElementById('sBuffer').value=params.bufferTime;
    document.getElementById('vBuffer').textContent=params.bufferTime.toFixed(2);
    document.getElementById('sHitbox').value=params.hitboxForgive;
    document.getElementById('vHitbox').textContent=params.hitboxForgive.toFixed(2);
    document.getElementById('vPhysics').textContent = params.jumpPhysics?'ВКЛ':'ВЫКЛ';
    tPhysics.textContent = params.jumpPhysics?'ВЫКЛЮЧИТЬ':'ВКЛЮЧИТЬ';
    tPhysics.classList.toggle('sel', params.jumpPhysics);
  }

  /* ---------- boot ---------- */
  resize();
  if(document.fonts&&document.fonts.load){ document.fonts.load("20px 'Pixelify Sans'").catch(()=>{}); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
